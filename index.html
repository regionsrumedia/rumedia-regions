<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#f4f5f6">
  <meta name="application-name" content="Регионы Румедиа">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Регионы Румедиа">

  <title>Регионы Румедиа</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f5f6;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f5f6;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #app.ready {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f4f5f6;
      color: #5f666c;
      font: 600 14px/1.4 Arial, Helvetica, sans-serif;
      transition: opacity .30s ease, visibility .30s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: min(68vw, 320px);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .loading-text {
      opacity: .78;
      text-align: center;
      padding: 0 20px;
    }

    .progress-wrap {
      width: min(70vw, 280px);
    }

    .progress {
      width: 100%;
      height: 7px;
      background: rgba(0, 0, 0, .08);
      border-radius: 20px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #f58220;
      border-radius: 20px;
      transition: width .18s linear;
    }

    #progress-label {
      display: none;
    }
  
    #install-banner {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 430px);
      box-sizing: border-box;
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 10px 30px rgba(0,0,0,.16);
      font: 600 14px/1.3 Arial, Helvetica, sans-serif;
      color: #222;
    }

    #install-banner.show {
      display: flex;
    }

    #install-copy {
      flex: 1;
      min-width: 0;
    }

    #install-hint {
      display: none;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #666;
    }

    #install-button {
      flex: 0 0 auto;
      border: 0;
      border-radius: 11px;
      padding: 11px 14px;
      background: #f58220;
      color: #fff;
      font: 700 14px/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    #install-close {
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 22px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }

    @media (display-mode: standalone) {
      #install-banner {
        display: none !important;
      }
    }

  </style>
</head>

<body>

  <div id="loader" aria-live="polite">
    <img
      class="splash-logo"
      src="./logo-rumedia.png"
      alt="Румедиа"
    >

    <div class="loading-text">
      Открываю «Регионы Румедиа»…
    </div>

    <div class="progress-wrap">
      <div class="progress" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-label">0%</div>
    </div>
  </div>


  <div id="install-banner" role="region" aria-label="Установка приложения">
    <div id="install-copy">
      <div>«Регионы Румедиа» можно установить на телефон</div>
      <div id="install-hint"></div>
    </div>
    <button id="install-button" type="button">Установить приложение</button>
    <button id="install-close" type="button" aria-label="Закрыть">×</button>
  </div>

  <iframe
    id="app"
    title="Регионы Румедиа"
    src="https://script.google.com/macros/s/AKfycbyHVQJJhuI26fzBS0yJeV7aJOz67eGpiWsRjHfq0D17AjC0hC7XHF1-oU63kZX0Mj8/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('app');
    const loader = document.getElementById('loader');
    const bar = document.getElementById('progress-bar');
    const label = document.getElementById('progress-label');
    const installBanner = document.getElementById('install-banner');
    const installButton = document.getElementById('install-button');
    const installClose = document.getElementById('install-close');
    const installHint = document.getElementById('install-hint');

    let deferredInstallPrompt = null;

    const isMobileDevice =
      (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
      /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function hideInstallBanner() {
      installBanner.classList.remove('show');
    }

    window.addEventListener('beforeinstallprompt', event => {
      if (!isMobileDevice || isStandalone()) return;

      event.preventDefault();
      deferredInstallPrompt = event;
      installHint.style.display = 'none';
      installButton.textContent = 'Установить приложение';
      installBanner.classList.add('show');
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      hideInstallBanner();
    });

    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;

      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;

      promptEvent.prompt();

      try {
        await promptEvent.userChoice;
      } catch (_) {}

      hideInstallBanner();
    });

    installClose.addEventListener('click', () => {
      hideInstallBanner();
    });

    let frameLoaded = false;
    let revealStarted = false;
    let loadAt = null;

    const startedAt = performance.now();
    const preLoadDurationMs = 12000;
    const postLoadHoldMs = 5500;

    function setProgress(value) {
      const safeValue = Math.max(0, Math.min(100, value));
      bar.style.width = safeValue + '%';
      label.textContent = Math.round(safeValue) + '%';
    }

    /*
      До события load прогресс плавно идёт примерно до 92%.
      После load он не замирает, а продолжает двигаться до 99%
      в течение времени, пока Google Apps Script визуально дорисовывается.
    */
    const progressTimer = setInterval(() => {
      const now = performance.now();
      let value;

      if (!frameLoaded) {
        const elapsed = now - startedAt;

        if (elapsed <= preLoadDurationMs) {
          value = (elapsed / preLoadDurationMs) * 92;
        } else {
          /*
            Если сеть медленная, после 92% продолжаем очень медленно
            ползти к 96%, а не замираем на одной цифре.
          */
          const extra = elapsed - preLoadDurationMs;
          value = 92 + Math.min(4, (extra / 18000) * 4);
        }
      } else {
        const elapsedAfterLoad = now - loadAt;
        const startValue = Math.max(
          0,
          Math.min(
            96,
            ((loadAt - startedAt) / preLoadDurationMs) * 92
          )
        );

        value = startValue +
          (99 - startValue) *
          Math.min(1, elapsedAfterLoad / postLoadHoldMs);
      }

      setProgress(Math.min(99, value));
    }, 100);

    function revealApp() {
      if (revealStarted) return;
      revealStarted = true;

      clearInterval(progressTimer);
      setProgress(100);

      /*
        Сначала делаем iframe видимым под непрозрачной заставкой,
        затем даём браузеру ещё немного времени на финальную отрисовку.
      */
      frame.classList.add('ready');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setTimeout(() => {
            loader.classList.add('hidden');

            setTimeout(() => {
              loader.style.display = 'none';
            }, 350);
          }, 300);
        });
      });
    }

    function handleFrameLoad() {
      if (frameLoaded) return;

      frameLoaded = true;
      loadAt = performance.now();

      /*
        На мобильных Google Apps Script может прислать load раньше,
        чем интерфейс визуально готов. Держим splash ещё 5,5 секунды.
      */
      setTimeout(revealApp, postLoadHoldMs);
    }

    frame.addEventListener('load', handleFrameLoad);

    /*
      Страховка: если load не придёт, через 30 секунд всё равно
      завершаем заставку, чтобы пользователь не остался на ней навсегда.
    */
    setTimeout(() => {
      if (!frameLoaded) {
        frameLoaded = true;
        loadAt = performance.now();
        setTimeout(revealApp, 1200);
      }
    }, 30000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }
  </script>

</body>
</html>
