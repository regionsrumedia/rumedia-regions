<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Регионы Румедиа">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Регионы Румедиа">
  <title>Регионы Румедиа</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f5f6;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f5f6;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #f4f5f6;
      color: #5f666c;
      font: 600 14px/1.4 Arial, Helvetica, sans-serif;
      transition: opacity .18s ease, visibility .18s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: min(46vw, 220px);
      height: auto;
      display: block;
      border-radius: 24%;
      box-shadow: 0 10px 32px rgba(0,0,0,.08);
    }

    .loading-text {
      opacity: .76;
      text-align: center;
      padding: 0 20px;
    }

    .loading-dots {
      display: inline-flex;
      gap: 5px;
      margin-top: -8px;
    }

    .loading-dots i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f58220;
      animation: pulse 1s infinite ease-in-out;
    }

    .loading-dots i:nth-child(2) { animation-delay: .16s; }
    .loading-dots i:nth-child(3) { animation-delay: .32s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: .28; transform: scale(.85); }
      40% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite">
    <img class="splash-logo" src="./splash-logo.png" alt="Румедиа">
    <div class="loading-text">Открываю «Регионы Румедиа»…</div>
    <div class="loading-dots" aria-hidden="true">
      <i></i><i></i><i></i>
    </div>
  </div>

  <iframe
    id="app"
    title="Регионы Румедиа"
    src="https://script.google.com/macros/s/AKfycbyHVQJJhuI26fzBS0yJeV7aJOz67eGpiWsRjHfq0D17AjC0hC7XHF1-oU63kZX0Mj8/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('app');
    const loader = document.getElementById('loader');

    frame.addEventListener('load', () => {
      requestAnimationFrame(() => loader.classList.add('hidden'));
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      });
    }
  </script>
</body>
</html>
