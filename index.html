<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#f4f5f6">
  <meta name="application-name" content="Регионы Румедиа">

  <title>Регионы Румедиа</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">


  <style>

    html, body {
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#f4f5f6;
    }


    #app {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#f4f5f6;
    }


    #loader {

      position:fixed;
      inset:0;
      z-index:10;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;

      gap:18px;

      background:#f4f5f6;

      color:#5f666c;

      font:600 14px/1.4 Arial,Helvetica,sans-serif;

      transition:opacity .35s ease, visibility .35s ease;

    }


    #loader.hidden {

      opacity:0;
      visibility:hidden;
      pointer-events:none;

    }


    .splash-logo {

      width:min(55vw,260px);
      height:auto;

      display:block;

    }


    .loading-text {

      opacity:.75;
      text-align:center;
      padding:0 20px;

    }


    .progress {

      width:min(70vw,280px);
      height:7px;

      background:rgba(0,0,0,.08);

      border-radius:20px;

      overflow:hidden;

      margin-top:5px;

    }


    #progress-bar {

      width:0%;

      height:100%;

      background:#f58220;

      transition:width .35s ease;

    }


    .loading-dots {

      display:flex;
      gap:5px;

    }


    .loading-dots i {

      width:6px;
      height:6px;

      border-radius:50%;

      background:#f58220;

      animation:pulse 1s infinite ease-in-out;

    }


    .loading-dots i:nth-child(2){
      animation-delay:.16s;
    }

    .loading-dots i:nth-child(3){
      animation-delay:.32s;
    }


    @keyframes pulse {

      0%,80%,100% {
        opacity:.3;
        transform:scale(.85);
      }

      40% {
        opacity:1;
        transform:scale(1);
      }

    }

  </style>

</head>


<body>


<div id="loader">


  <img 
    class="splash-logo"
    src="./logo-rumedia.png"
    alt="Румедиа"
  >


  <div class="loading-text">
    Открываю «Регионы Румедиа»…
  </div>


  <div class="progress">
    <div id="progress-bar"></div>
  </div>


  <div class="loading-dots">
    <i></i>
    <i></i>
    <i></i>
  </div>


</div>



<iframe

  id="app"

  title="Регионы Румедиа"

  src="https://script.google.com/macros/s/AKfycbyHVQJJhuI26fzBS0yJeV7aJOz67eGpiWsRjHfq0D17AjC0hC7XHF1-oU63kZX0Mj8/exec"

  allow="clipboard-read; clipboard-write"

  loading="eager"

></iframe>



<script>


const frame = document.getElementById('app');

const loader = document.getElementById('loader');

const bar = document.getElementById('progress-bar');


let progress = 0;

let finished = false;



// плавная загрузка до 90%

const timer = setInterval(()=>{


  if(progress < 90){

    progress += Math.random()*4;

    if(progress>90) progress=90;

    bar.style.width = progress + "%";

  }


},350);





function hideLoader(){


  if(finished) return;


  finished=true;


  clearInterval(timer);


  bar.style.width="100%";


  setTimeout(()=>{


    loader.classList.add('hidden');


    setTimeout(()=>{

      loader.style.display="none";

    },400);



  },300);



}





frame.addEventListener('load',()=>{


  hideLoader();


});





// защита от зависания

setTimeout(()=>{


  hideLoader();


},30000);





if('serviceWorker' in navigator){


window.addEventListener('load',()=>{


navigator.serviceWorker

.register('./sw.js',{scope:'./'})

.then(reg=>reg.update())

.catch(()=>{});


});


}


</script>


</body>

</html>
