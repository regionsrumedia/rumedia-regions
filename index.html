<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#f4f5f6">
  <meta name="application-name" content="Регионы Румедиа">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Регионы Румедиа">

  <title>Регионы Румедиа</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f5f6;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f5f6;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #app.ready {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f5f6;
      color: #17191c;
      font-family: Arial, Helvetica, sans-serif;
      transition: opacity .24s ease, visibility .24s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-mark {
      width: min(78vw, 360px);
      text-align: left;
    }

    .splash-kicker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: #73787d;
      font-size: 12px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .splash-kicker::before {
      content: '';
      width: 24px;
      height: 4px;
      border-radius: 999px;
      background: #f58220;
    }

    .splash-title {
      margin: 0;
      font-size: clamp(34px, 10vw, 54px);
      line-height: .98;
      font-weight: 900;
      letter-spacing: -.045em;
    }

    .splash-subtitle {
      margin-top: 12px;
      color: #6f757a;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 600;
    }

    .progress-wrap {
      width: min(78vw, 360px);
      margin-top: 30px;
    }

    .progress {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, .08);
      border-radius: 20px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #f58220;
      border-radius: 20px;
      transition: width .18s linear;
    }

    #progress-label {
      display: none;
    }
  
    #install-card {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 30;
      width: min(calc(100vw - 24px), 440px);
      box-sizing: border-box;
      display: none;
      padding: 18px;
      border: 1px solid rgba(0,0,0,.09);
      border-radius: 20px;
      background: rgba(255,255,255,.98);
      box-shadow: 0 12px 36px rgba(0,0,0,.18);
      color: #17191c;
      font-family: Arial, Helvetica, sans-serif;
    }

    #install-card.show {
      display: block;
    }

    #install-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #73777c;
      font: 400 26px/36px Arial, Helvetica, sans-serif;
      text-align: center;
      cursor: pointer;
    }

    #install-title {
      margin: 0 38px 6px 0;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 700;
    }

    #install-text {
      margin: 0;
      color: #60656b;
      font-size: 14px;
      line-height: 1.45;
      font-weight: 400;
    }

    #install-actions {
      margin-top: 14px;
    }

    #install-button {
      width: 100%;
      min-height: 48px;
      box-sizing: border-box;
      border: 0;
      border-radius: 13px;
      padding: 13px 16px;
      background: #f58220;
      color: #fff;
      font: 700 15px/1.2 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }

    #install-button[hidden] {
      display: none;
    }

    #install-button:disabled {
      opacity: .72;
      cursor: default;
    }

    #install-spinner {
      display: none;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      vertical-align: -3px;
      border: 2px solid rgba(255,255,255,.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: install-spin .8s linear infinite;
    }

    #install-button.busy #install-spinner {
      display: inline-block;
    }

    @keyframes install-spin {
      to { transform: rotate(360deg); }
    }

    #install-success {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(18px);
      z-index: 31;
      width: min(calc(100vw - 24px), 440px);
      box-sizing: border-box;
      display: none;
      padding: 15px 18px;
      border-radius: 16px;
      background: #17191c;
      color: #fff;
      box-shadow: 0 12px 36px rgba(0,0,0,.20);
      font: 600 14px/1.4 Arial, Helvetica, sans-serif;
      opacity: 0;
      transition: opacity .18s ease, transform .18s ease;
    }

    #install-success.show {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (display-mode: standalone) {
      #install-card,
      #install-success {
        display: none !important;
      }
    }

    @media (min-width: 800px) and (pointer: fine) {
      #install-card,
      #install-success {
        display: none !important;
      }
    }

  </style>
</head>

<body>

  <div id="loader" aria-live="polite">
    <div class="splash-mark">
      <div class="splash-kicker">Румедиа</div>
      <h1 class="splash-title">Регионы<br>вещания</h1>
      <div class="splash-subtitle">Business FM · Радио Шоколад</div>
    </div>

    <div class="progress-wrap">
      <div class="progress" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-label">0%</div>
    </div>
  </div>


  <div id="install-card" role="dialog" aria-live="polite" aria-label="Установка приложения">
    <button id="install-close" type="button" aria-label="Закрыть">×</button>
    <h2 id="install-title">Установить «Регионы Румедиа»</h2>
    <p id="install-text">Приложение появится на экране приложений телефона.</p>
    <div id="install-actions">
      <button id="install-button" type="button">
        <span id="install-spinner" aria-hidden="true"></span>
        <span id="install-button-text">Установить приложение</span>
      </button>
    </div>
  </div>

  <div id="install-success" role="status" aria-live="polite">
    Приложение установлено. Ищите значок «Регионы Румедиа» на экране приложений.
  </div>

  <iframe
    id="app"
    title="Регионы Румедиа"
    src="https://script.google.com/macros/s/AKfycbyHVQJJhuI26fzBS0yJeV7aJOz67eGpiWsRjHfq0D17AjC0hC7XHF1-oU63kZX0Mj8/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('app');
    const loader = document.getElementById('loader');
    const bar = document.getElementById('progress-bar');
    const label = document.getElementById('progress-label');
    const installCard = document.getElementById('install-card');
    const installButton = document.getElementById('install-button');
    const installButtonText = document.getElementById('install-button-text');
    const installClose = document.getElementById('install-close');
    const installTitle = document.getElementById('install-title');
    const installText = document.getElementById('install-text');
    const installSuccess = document.getElementById('install-success');

    let deferredInstallPrompt = null;
    let appVisible = false;
    let installDismissedForThisView = false;
    let installFallbackTimer = null;
    let installationAccepted = false;
    let installedRelatedAppDetected = false;

    const ua = navigator.userAgent || '';
    const isAndroid = /Android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isSamsungInternet = /SamsungBrowser\//i.test(ua);
    const isMobileDevice =
      (navigator.userAgentData && navigator.userAgentData.mobile === true) ||
      isAndroid || isIOS;

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true;
    }

    function hideInstallCard() {
      installCard.classList.remove('show');
    }

    function resetInstallButton() {
      installButton.disabled = false;
      installButton.hidden = false;
      installButton.classList.remove('busy');
      installButtonText.textContent = 'Установить приложение';
    }

    function showDirectInstallCard() {
      if (!appVisible || !isMobileDevice || isStandalone() ||
          installedRelatedAppDetected || installDismissedForThisView) return;

      installTitle.textContent = 'Установить «Регионы Румедиа»';
      installText.textContent =
        'Приложение появится на экране приложений телефона.';
      resetInstallButton();
      installCard.classList.add('show');
    }

    function manualInstallText() {
      if (isIOS) {
        return 'Нажмите «Поделиться» и выберите «На экран Домой».';
      }

      if (isSamsungInternet) {
        return 'Нажмите значок установки вверху. Если его нет, откройте меню браузера и выберите добавление на экран приложений.';
      }

      if (isAndroid) {
        return 'Откройте меню ⋮ и выберите «Установить приложение». Если видите «Открыть в Chrome», сначала выберите его.';
      }

      return 'Откройте эту ссылку в Chrome или Samsung Internet и выберите установку приложения в меню браузера.';
    }

    function showManualInstallCard(prefix = '') {
      if (!appVisible || !isMobileDevice || isStandalone() ||
          installedRelatedAppDetected || installDismissedForThisView) return;

      installTitle.textContent = 'Установить «Регионы Румедиа»';
      installText.textContent = prefix ? prefix + ' ' + manualInstallText() : manualInstallText();
      installButton.hidden = true;
      installButton.disabled = false;
      installButton.classList.remove('busy');
      installCard.classList.add('show');
    }

    async function detectInstalledPwa() {
      if (!isMobileDevice || isStandalone() ||
          typeof navigator.getInstalledRelatedApps !== 'function') return;

      try {
        const apps = await navigator.getInstalledRelatedApps();
        if (apps.some(app => app.platform === 'webapp')) {
          installedRelatedAppDetected = true;
          deferredInstallPrompt = null;
          hideInstallCard();
        }
      } catch (_) {
        // API поддерживается не везде; отсутствие результата не считаем ошибкой.
      }
    }

    async function scheduleInstallUi() {
      if (!appVisible || !isMobileDevice || isStandalone() || installDismissedForThisView) return;

      await detectInstalledPwa();
      if (installedRelatedAppDetected || isStandalone() || installDismissedForThisView) return;

      if (deferredInstallPrompt) {
        showDirectInstallCard();
        return;
      }

      clearTimeout(installFallbackTimer);
      installFallbackTimer = setTimeout(() => {
        if (deferredInstallPrompt) {
          showDirectInstallCard();
        } else {
          showManualInstallCard();
        }
      }, 1400);
    }

    window.addEventListener('beforeinstallprompt', event => {
      // По возможности подавляем автоматическую браузерную промо-плашку,
      // чтобы на ПК не появлялся наш собственный сценарий установки.
      event.preventDefault();

      if (!isMobileDevice || isStandalone()) return;

      deferredInstallPrompt = event;
      if (appVisible && !installationAccepted) {
        clearTimeout(installFallbackTimer);
        showDirectInstallCard();
      }
    });

    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt || installButton.disabled) return;

      const promptEvent = deferredInstallPrompt;
      deferredInstallPrompt = null;

      installButton.disabled = true;
      installButton.classList.add('busy');
      installButtonText.textContent = 'Открываю установку…';
      installText.textContent = 'Подтвердите установку в системном окне.';

      let result = null;
      try {
        result = await promptEvent.prompt();
        if ((!result || !result.outcome) && promptEvent.userChoice) {
          result = await promptEvent.userChoice;
        }
      } catch (_) {
        showManualInstallCard('Системное окно не открылось.');
        return;
      }

      if (result && result.outcome === 'accepted') {
        installationAccepted = true;
        installTitle.textContent = 'Установка началась';
        installText.textContent =
          'Android может показать ход установки в уведомлениях. После завершения ищите значок приложения на экране приложений.';
        installButton.hidden = true;
        installButton.disabled = false;
        installButton.classList.remove('busy');

        // Если appinstalled задержится, не выдаём ложное «готово».
        setTimeout(() => {
          if (installationAccepted && !installedRelatedAppDetected) {
            installText.textContent =
              'Установка запущена. Если системное окно уже закрылось, проверьте экран приложений телефона.';
          }
        }, 10000);
      } else {
        installationAccepted = false;
        showManualInstallCard('Установка отменена.');
      }
    });

    window.addEventListener('appinstalled', () => {
      installationAccepted = false;
      installedRelatedAppDetected = true;
      deferredInstallPrompt = null;
      clearTimeout(installFallbackTimer);
      hideInstallCard();

      if (!isMobileDevice || isStandalone()) return;

      installSuccess.classList.add('show');
      setTimeout(() => {
        installSuccess.classList.remove('show');
        setTimeout(() => {
          installSuccess.style.display = 'none';
        }, 220);
      }, 5500);
    });

    installClose.addEventListener('click', () => {
      installDismissedForThisView = true;
      clearTimeout(installFallbackTimer);
      hideInstallCard();
    });

    detectInstalledPwa();

    let frameLoaded = false;
    let appReadyMessage = false;
    let revealStarted = false;
    let loadAt = null;

    const startedAt = performance.now();
    const preLoadDurationMs = 9000;

    function setProgress(value) {
      const safeValue = Math.max(0, Math.min(100, value));
      bar.style.width = safeValue + '%';
      label.textContent = Math.round(safeValue) + '%';
    }

    /*
      До готовности приложения индикатор спокойно доходит до 94–97%.
      Сам iframe не показываем, пока страница внутри не сообщит, что интерфейс
      действительно отрисован. Это убирает белый промежуточный экран.
    */
    const progressTimer = setInterval(() => {
      const elapsed = performance.now() - startedAt;
      let value;

      if (elapsed <= preLoadDurationMs) {
        value = (elapsed / preLoadDurationMs) * 94;
      } else {
        value = 94 + Math.min(3, ((elapsed - preLoadDurationMs) / 15000) * 3);
      }

      setProgress(Math.min(97, value));
    }, 100);

    function revealApp() {
      if (revealStarted) return;
      revealStarted = true;

      clearInterval(progressTimer);
      setProgress(100);
      frame.classList.add('ready');

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          setTimeout(() => {
            loader.classList.add('hidden');

            setTimeout(() => {
              loader.style.display = 'none';
              appVisible = true;
              scheduleInstallUi();
            }, 260);
          }, 120);
        });
      });
    }

    function handleFrameLoad() {
      if (frameLoaded) return;
      frameLoaded = true;
      loadAt = performance.now();

      /*
        Для старой версии страницы без postMessage оставляем страховку:
        после load держим заставку дольше, чем раньше, чтобы не показать
        пустой белый документ Google Apps Script.
      */
      setTimeout(() => {
        if (!appReadyMessage) revealApp();
      }, 11000);
    }

    frame.addEventListener('load', handleFrameLoad);

    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow) return;
      const data = event.data;
      if (!data || data.type !== 'rumedia-app-ready') return;

      appReadyMessage = true;
      revealApp();
    });

    /*
      Крайняя страховка на случай сетевой ошибки: не держим пользователя
      на заставке бесконечно.
    */
    setTimeout(() => {
      if (!revealStarted) revealApp();
    }, 32000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }
  </script>

</body>
</html>
