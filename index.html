<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#f4f5f6">
  <meta name="application-name" content="Регионы Румедиа">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Регионы Румедиа">

  <title>Регионы Румедиа</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link rel="dns-prefetch" href="//script.google.com">
  <link rel="dns-prefetch" href="//script.googleusercontent.com">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f5f6;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f5f6;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #app.ready {
      opacity: 1;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #f4f5f6;
      color: #5f666c;
      font: 600 14px/1.4 Arial, Helvetica, sans-serif;
      transition: opacity .30s ease, visibility .30s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: min(68vw, 320px);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .loading-text {
      opacity: .78;
      text-align: center;
      padding: 0 20px;
    }

    .progress-wrap {
      width: min(70vw, 280px);
    }

    .progress {
      width: 100%;
      height: 7px;
      background: rgba(0, 0, 0, .08);
      border-radius: 20px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: #f58220;
      border-radius: 20px;
      transition: width .18s linear;
    }

    #progress-label {
      margin-top: 7px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      opacity: .62;
    }
  </style>
</head>

<body>

  <div id="loader" aria-live="polite">
    <img
      class="splash-logo"
      src="./logo-rumedia.png"
      alt="Румедиа"
    >

    <div class="loading-text">
      Открываю «Регионы Румедиа»…
    </div>

    <div class="progress-wrap">
      <div class="progress" aria-hidden="true">
        <div id="progress-bar"></div>
      </div>
      <div id="progress-label">0%</div>
    </div>
  </div>

  <iframe
    id="app"
    title="Регионы Румедиа"
    src="https://script.google.com/macros/s/AKfycbyHVQJJhuI26fzBS0yJeV7aJOz67eGpiWsRjHfq0D17AjC0hC7XHF1-oU63kZX0Mj8/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
  ></iframe>

  <script>
    const frame = document.getElementById('app');
    const loader = document.getElementById('loader');
    const bar = document.getElementById('progress-bar');
    const label = document.getElementById('progress-label');

    let finished = false;
    const startedAt = performance.now();

    /*
      Расчётная длительность загрузки — около 10 секунд.
      До фактической готовности iframe шкала доходит максимум до 92%.
      100% показывается только после события load.
    */
    const expectedLoadMs = 12000;

    function setProgress(value) {
      const safeValue = Math.max(0, Math.min(100, value));
      bar.style.width = safeValue + '%';
      label.textContent = Math.round(safeValue) + '%';
    }

    const progressTimer = setInterval(() => {
      if (finished) return;

      const elapsed = performance.now() - startedAt;
      const calculated = (elapsed / expectedLoadMs) * 92;

      setProgress(Math.min(92, calculated));
    }, 120);

    function finishLoading() {
      if (finished) return;
      finished = true;

      clearInterval(progressTimer);

      /*
        iframe Google Apps Script может прислать load раньше,
        чем интерфейс реально появился на экране.
        Поэтому держим заставку минимум 12 секунд от начала запуска.
        Это заменяет пустой экран понятным прогрессом.
      */
      const minSplashMs = 12000;
      const elapsed = performance.now() - startedAt;
      const waitMore = Math.max(0, minSplashMs - elapsed);

      setTimeout(() => {
        setProgress(100);

        setTimeout(() => {
          frame.classList.add('ready');

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              setTimeout(() => {
                loader.classList.add('hidden');

                setTimeout(() => {
                  loader.style.display = 'none';
                }, 350);
              }, 250);
            });
          });
        }, 550);
      }, waitMore);
    }

    frame.addEventListener('load', finishLoading);

    /*
      Страховка от вечной заставки при проблемах с Google Apps Script.
      Через 30 секунд приложение всё равно будет показано.
    */
    setTimeout(finishLoading, 30000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js', { scope: './' })
          .then(registration => registration.update())
          .catch(() => {});
      });
    }
  </script>

</body>
</html>
